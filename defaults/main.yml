# vim: tabstop=2 expandtab shiftwidth=2 softtabstop=2 smartindent nu ft=yaml
---
# define a dict of list of opnsense plugins to install
# for backward compatibility a simple list is still supported
# the advantage of dict of list: they are mergeable!
# https://github.com/Rosa-Luxemburgstiftung-Berlin/ansible-opnsense-plugpack/issues/7
# opn_plugins:
#  all:
#    - os-lldpd
#    - os-net-snmp
opn_plugins: {}

# opnsense plugins to remove
# dict of list or simple list
opn_plugins_remove: {}

# dict of list or list of additional packages to install
# opn_packages:
#   - bash
#   - bash-completion
#   - bind-tools
opn_packages: {}

# dict of list or list of packages to remove
opn_packages_remove: {}

# dict of list or list of packages to lock, i.e. prevent upgrades
opn_packages_lock: {}

# opnsense-revert
# see https://docs.opnsense.org/manual/opnsense_tools.html#opnsense-revert
# dict : revert what to which version ?
# example:
# opnsense_revert:
#   nut: 26.1.7
#   bash: # an empty string should do nothing - this way you can override a previously defined revert
opnsense_revert: {}

# seconds to wait between tasks
opn_plugpack_sleep: 1
...
